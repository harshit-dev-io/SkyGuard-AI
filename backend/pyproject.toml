[project]
name = "skyguard-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "aiomqtt>=2.5.1",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "geoalchemy2>=0.20.0",
    "httpx>=0.28.1",
    "jose>=1.0.0",
    "paho-mqtt>=2.1.0",
    "passlib>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.14.0",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
