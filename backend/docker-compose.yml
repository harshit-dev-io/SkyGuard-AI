version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. TimescaleDB (PostgreSQL 16 + PostGIS + TimescaleDB)
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: skyguard-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skyguard_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skyguard_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-skyguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skyguard_admin} -d ${POSTGRES_DB:-skyguard}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skyguard-net

  # ---------------------------------------------------------------------------
  # 2. Redis Ingestion Buffer, Quarantine & Celery Broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: skyguard-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-skyguard_redis_pwd}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-skyguard_redis_pwd}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - skyguard-net

  # ---------------------------------------------------------------------------
  # 3. Eclipse Mosquitto MQTT Broker (Edge Telemetry & WIS2 WNM Notifications)
  # ---------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: skyguard-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -i healthcheck -W 3 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - skyguard-net

  # ---------------------------------------------------------------------------
  # 4. Apache Kafka (KRaft Mode - No ZooKeeper Required)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: skyguard-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT_INTERNAL'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - skyguard-net

  # ---------------------------------------------------------------------------
  # 5. Kafka Topic Auto-Provisioner
  # Automatically creates all required topics across ingestion and evidence flock
  # ---------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: skyguard-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'Provisioning SkyGuard Kafka topics...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC_RAW_OBSERVATIONS:-observations.raw} --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${KAFKA_TOPIC_DEAD_LETTER:-observations.deadletter} --partitions 1 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${TOPIC_EVIDENCE_TEMPORAL:-evidence.temporal} --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${TOPIC_EVIDENCE_SPATIAL:-evidence.spatial} --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${TOPIC_EVIDENCE_EVENT:-evidence.event} --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${TOPIC_EVIDENCE_HEALTH:-evidence.health} --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${TOPIC_FUSED_BUNDLES:-bundles.fused} --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic ${TOPIC_CLASSIFICATION_OUTPUT:-classifications.state_fault} --partitions 3 --replication-factor 1

      echo 'Kafka topics provisioned successfully.'
      "
    networks:
      - skyguard-net

  # ---------------------------------------------------------------------------
  # 6. SkyGuard AI FastAPI Core Application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyguard-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-skyguard_admin}:${POSTGRES_PASSWORD:-skyguard_secure_pwd}@timescaledb:5432/${POSTGRES_DB:-skyguard}
      - DATABASE_SYNC_URL=postgresql+psycopg2://${POSTGRES_USER:-skyguard_admin}:${POSTGRES_PASSWORD:-skyguard_secure_pwd}@timescaledb:5432/${POSTGRES_DB:-skyguard}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-skyguard_redis_pwd}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-skyguard_redis_pwd}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-skyguard_redis_pwd}@redis:6379/2
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - WIS2_GB_HOST=mosquitto
      - WIS2_GB_PORT=1883
      - WIS2_BASE_URL=${WIS2_BASE_URL:-http://localhost:8000/api/v1/wis2/data}
      - SECRET_KEY=${SECRET_KEY:-skyguard_production_secret_key_change_me_9a4f20c8e137}
      - PROJECT_NAME=${PROJECT_NAME:-SkyGuard AI Weather Ingestion Platform}
      - API_V1_PREFIX=${API_V1_PREFIX:-/api/v1}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    volumes:
      - wis2_data:/app/data/wis2_objects
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - skyguard-net

  # ---------------------------------------------------------------------------
  # 7. Celery Worker (Background Maintenance, RUL, Topology, Load Shedding)
  # ---------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyguard-celery-worker
    restart: unless-stopped
    command: celery -A app.background_jobs.celery_app worker --loglevel=info -Q celery,monitoring,analytics,topology
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-skyguard_admin}:${POSTGRES_PASSWORD:-skyguard_secure_pwd}@timescaledb:5432/${POSTGRES_DB:-skyguard}
      - DATABASE_SYNC_URL=postgresql+psycopg2://${POSTGRES_USER:-skyguard_admin}:${POSTGRES_PASSWORD:-skyguard_secure_pwd}@timescaledb:5432/${POSTGRES_DB:-skyguard}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-skyguard_redis_pwd}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-skyguard_redis_pwd}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-skyguard_redis_pwd}@redis:6379/2
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=1883
      - SECRET_KEY=${SECRET_KEY:-skyguard_production_secret_key_change_me_9a4f20c8e137}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - skyguard-net

  # ---------------------------------------------------------------------------
  # 8. Celery Beat (Periodic Automation & Health Probe Scheduler)
  # ---------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyguard-celery-beat
    restart: unless-stopped
    command: celery -A app.background_jobs.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-skyguard_admin}:${POSTGRES_PASSWORD:-skyguard_secure_pwd}@timescaledb:5432/${POSTGRES_DB:-skyguard}
      - DATABASE_SYNC_URL=postgresql+psycopg2://${POSTGRES_USER:-skyguard_admin}:${POSTGRES_PASSWORD:-skyguard_secure_pwd}@timescaledb:5432/${POSTGRES_DB:-skyguard}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-skyguard_redis_pwd}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-skyguard_redis_pwd}@redis:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-skyguard_redis_pwd}@redis:6379/2
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_SECURITY_PROTOCOL=PLAINTEXT
      - SECRET_KEY=${SECRET_KEY:-skyguard_production_secret_key_change_me_9a4f20c8e137}
    depends_on:
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    networks:
      - skyguard-net

# -----------------------------------------------------------------------------
# Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  timescaledb_data:
  redis_data:
  kafka_data:
  mosquitto_data:
  mosquitto_log:
  wis2_data:

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  skyguard-net:
    driver: bridge